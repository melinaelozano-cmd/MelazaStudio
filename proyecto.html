<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melaza Studio — Proyecto</title>
  <link rel="icon" type="image/png" href="favicon-claro.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="favicon-oscuro.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Tipografías oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Libre+Baskerville:wght@700&family=Questrial&family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Bricolage+Grotesque:wght@600;700&family=Chivo+Mono:wght@500;700&family=Kalnia:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">

  <!-- Matter.js: física del contenedor final (misma que la Home) -->

  <style>
    /* ==========================================================================
       1. VARIABLES & RESET
       La página arranca en rojo (color al que llega la expansión del home) y
       enseguida se encoge hasta la forma roja sobre fondo blanco.
       ========================================================================== */
    :root {
      --primary: #600F08;           /* Rojo Melaza (bordó del PDF) */
      --primary-hover: #7D150B;
      --primary-deep: #3F0A05;      /* Bordó más oscuro (esferas) */
      --paper: #FAFAFA;             /* Papel Tinta */
      --ink: #111111;
      --sel: #E8786D;               /* Rojo clarito: trabajo seleccionado */
      --sel-hover: #F08F85;
      --ui: var(--primary);         /* color de logo, menú, cruz y barra (cambia sobre rojo) */
      --ui-inv: var(--paper);       /* color que contrasta con --ui (texto de las etiquetas del índice) */
      --font-title: 'Kalnia', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;

      --pad: 6vw;                   /* margen lateral de cada panel */
      --header-h: 80px;
      --hero-d: min(60vh, 44vw);    /* diámetro del círculo principal */
      --bw: 4px;                    /* grosor del borde rojo: igual en todos los círculos */
      --band-left: 10vw;            /* donde empieza la banda roja (lado izquierdo, parte redondeada) */
      --hr: min(38vh, 40.5vw);      /* radio de la parte redondeada de la banda */
      --gl: min(36vh, 44vw);        /* imagen grande de la galería */
      --gm: calc(var(--gl) * 0.6);  /* imagen chica de la galería */
      --gg: min(3vh, 4vw);          /* separación de la grilla */
      --ec: var(--hero-d);          /* mismo diámetro que la imagen inicial */
      --glimpse: 14vw;              /* cuánto de la galería se asoma a la izquierda del final */
      --ps: min(24vh, 20vw);        /* diámetro de las imágenes de cada etapa */
      --us: min(54vh, 70vw);        /* lado del recuadro UI Kit */
    }
    body.on-red { --ui: var(--paper); --ui-inv: var(--primary); }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--primary); }
    html.ready { background: var(--paper) url("assets/papel.jpg") center / cover fixed; }   /* textura de papel: solo donde el fondo es blanco */

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      color: var(--paper);
      font-family: var(--font-body);
    }
    body { background: transparent; transition: opacity 0.35s ease; }
    body.is-leaving { opacity: 0; }

    /* ==========================================================================
       2. NAVEGACIÓN + CRUZ DE CIERRE (fija arriba a la derecha)
       ========================================================================== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5vw;
      z-index: 30;
    }

    header .logo {
      font-family: var(--font-title);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ui);
      text-decoration: none;
      transition: color 0.4s ease;
    }

    /* Logo + subtítulo: toman --ui, así cambian de color sobre rojo / blanco */
    header .brand { display: flex; flex-direction: column; text-decoration: none; }
    header .tagline { font-size: 0.78rem; letter-spacing: 0.06em; color: var(--ui); opacity: 0.8; margin-top: 2px; transition: color 0.4s ease; }

    nav ul { display: flex; gap: 2.5rem; list-style: none; }
    nav a {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ui);
      text-decoration: none;
      transition: opacity 0.3s ease, color 0.4s ease;
    }
    nav a:hover { opacity: 0.6; }

    /* Índice de proyectos: centrado arriba; el proyecto actual se abre con su nombre */
    .idx {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      list-style: none;
      max-width: 52vw;
    }
    .idx a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.55rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--ui);
      opacity: 0.55;
      white-space: nowrap;
      transition: opacity 0.3s ease, background 0.4s ease, color 0.4s ease;
    }
    .idx a { position: relative; }
    .idx a:hover { opacity: 1; }
    /* Al pasar el mouse por un número no seleccionado, el nombre del proyecto aparece abajo */
    @media (hover: hover) {
      .idx a:not(.on)::after {
        content: attr(data-name);
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        transform: translate(-50%, -4px);
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        background: var(--ui);
        color: var(--ui-inv);
        font-family: var(--font-title);
        font-style: italic;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.4s ease, color 0.4s ease;
      }
      .idx a:not(.on):hover::after, .idx a:not(.on):focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
    }
    .idx a span {
      font-family: var(--font-title);
      font-style: italic;
      max-width: 0;
      overflow: hidden;
      transition: max-width 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .idx a.on { opacity: 1; background: color-mix(in srgb, var(--ui) 16%, transparent); padding-right: 0.9rem; }
    .idx a.on span { max-width: 18ch; }

    /* Cruz: al final del menú, vuelve a la Home */
    nav li { display: flex; align-items: center; }
    .close {
      position: relative;
      width: 24px;
      height: 24px;
      color: var(--ui);
      display: grid;
      place-items: center;
      text-decoration: none;
      transition: color 0.4s ease;
    }
    .close::after { content: ""; position: absolute; inset: -12px; }   /* zona de toque más grande */
    /* Círculo envolvente: aparece alrededor de la cruz al pasar el mouse */
    .close::before {
      content: "";
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--ui) 20%, transparent);
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.4s ease;
    }
    .close:hover::before, .close:focus-visible::before { opacity: 1; transform: scale(1); }
    .close svg { width: 22px; height: 22px; }

    /* ==========================================================================
       3. FORMA ROJA (inspirada en la banda del PDF A4)
       Banda que nace en el borde izquierdo y termina en medio círculo a la
       derecha. Con el scroll se extiende hasta tocar los bordes y cubre todo.
       ========================================================================== */
    #red-shape {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: var(--primary);
      z-index: 1;
      pointer-events: none;
      contain: layout paint style;
    }
    #red-shape-b {
      position: fixed;
      left: 0;
      top: 0;
      background: var(--primary);
      z-index: 1;
      pointer-events: none;
      contain: layout paint style;
      display: none;
    }
    #red-shape.settling {
      transition: top 1.1s cubic-bezier(0.7, 0, 0.2, 1),
                  height 1.1s cubic-bezier(0.7, 0, 0.2, 1),
                  width 1.1s cubic-bezier(0.7, 0, 0.2, 1),
                  left 1.1s cubic-bezier(0.7, 0, 0.2, 1),
                  border-radius 1.1s cubic-bezier(0.7, 0, 0.2, 1);
    }

    /* ==========================================================================
       4. SCROLL HORIZONTAL
       ========================================================================== */
    #scroller {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      overscroll-behavior: contain;
      outline: none;
    }
    #scroller::-webkit-scrollbar { display: none; }

    .track {
      display: flex;
      height: 100%;
      width: max-content;
      padding-top: var(--header-h);
    }

    .panel {
      flex: none;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6vw;
      padding: 0 var(--pad) 36px;
      position: relative;
    }

    /* Barra de progreso del scroll */
    #progress {
      position: fixed;
      left: 5vw;
      right: 5vw;
      bottom: 22px;
      height: 2px;
      background: color-mix(in srgb, var(--ui) 22%, transparent);
      z-index: 20;
      opacity: 0;
      transition: background 0.4s ease, opacity 0.5s ease;
    }
    body.show-progress #progress { opacity: 1; pointer-events: auto; }
    /* Zona de clic más alta que la línea; al pasar el mouse la barra engrosa y aparece el tirador */
    #progress { cursor: pointer; pointer-events: none; touch-action: none; transition: background 0.4s ease, opacity 0.5s ease, height 0.2s ease, bottom 0.2s ease; }
    #progress::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; bottom: -14px; }
    #progress::after {
      content: "";
      position: absolute;
      top: 50%;
      left: var(--pos, 0%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ui);
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s ease, background 0.4s ease;
    }
    @media (hover: hover) {
      #progress:hover, #progress.drag { height: 6px; bottom: 20px; border-radius: 3px; }
      #progress:hover::after, #progress.drag::after { transform: translate(-50%, -50%) scale(1); }
    }
    #progress i {
      display: block;
      height: 100%;
      background: var(--ui);
      transform-origin: left center;
      transform: scaleX(0);
    }

    /* Indicación de scroll */
    #scroll-hint {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--ui);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, color 0.4s ease;
    }
    html.ready #scroll-hint { opacity: 0.9; transition-delay: 1.8s, 0s; }
    #scroll-hint.gone, html.ready #scroll-hint.gone { opacity: 0; transition-delay: 0s; }
    #scroll-hint i {
      position: relative;
      width: 44px;
      height: 1.5px;
      background: currentColor;
      animation: nudge 1.6s ease-in-out infinite;
    }
    #scroll-hint i::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3.5px;
      width: 8px;
      height: 8px;
      border-top: 1.5px solid currentColor;
      border-right: 1.5px solid currentColor;
      transform: rotate(45deg);
      transform-origin: center;
    }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }

    /* Indicador "+" (círculo que pulsa y gira al pasar el mouse): lo llevan todos los elementos que revelan más información con el hover.
       .hp.lt es la versión clara, para fondos rojos u oscuros. El contenedor lleva la clase .hv. */
    .hp { display: inline-block; position: relative; flex: none; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: var(--hp-bg, var(--primary)); animation: hpPulse 2.6s ease-in-out infinite; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
    .hp::before, .hp::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46%; height: 1.5px; border-radius: 1px; background: var(--hp-fg, var(--paper)); transform: translate(-50%, -50%); transition: transform .3s; }
    .hp::after { transform: translate(-50%, -50%) rotate(90deg); }
    .hp.lt { --hp-bg: rgba(250,250,250,.2); --hp-fg: var(--paper); --hp-ring: rgba(250,250,250,.25); }
    .hv:focus-visible .hp, .hv.open .hp { transform: rotate(180deg); }
    .hv:focus-visible .hp::after, .hv.open .hp::after { transform: translate(-50%, -50%) rotate(0); }
    @media (hover: hover) {
      .hv:hover .hp { transform: rotate(180deg); }
      .hv:hover .hp::after { transform: translate(-50%, -50%) rotate(0); }
    }
    @keyframes hpPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--hp-ring, rgba(96,15,8,.3)); } 50% { box-shadow: 0 0 0 5px transparent; } }
    @media (prefers-reduced-motion: reduce) { .hp { animation: none; } }

    /* Aparición de contenidos al entrar en pantalla */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      transition-delay: var(--d, 0s);
    }
    .reveal.in { opacity: 1; transform: none; }

    /* ==========================================================================
       5. CÍRCULO PRINCIPAL (a la izquierda, sale con el scroll)
       ========================================================================== */
    .hero-circle {
      position: fixed;
      left: calc(var(--band-left) + var(--hr) - var(--hero-d) / 2);   /* concéntrico con la curva */
      top: 50%;
      width: var(--hero-d);
      height: var(--hero-d);
      margin-top: calc(var(--hero-d) / -2);
      z-index: 6;
      pointer-events: none;
      will-change: transform;
    }

    /* Disco blanco = lugar de la foto (vacío hasta cargar la imagen) */
    .hero-circle .disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--paper);
      overflow: hidden;
      animation: pop 0.95s cubic-bezier(0.2, 0.9, 0.2, 1) 0.6s both;
    }
    .hero-circle .disc img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @keyframes pop  { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ==========================================================================
       6. PANELES
       ========================================================================== */
    .label {
      display: block;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--sel);
      margin-bottom: 1rem;
    }

    /* Círculo blanco vacío (placeholder de foto) */

     .disc:empty { display: flex; align-items: center; justify-content: center; }
     .disc:empty::after {
      content: attr(data-label);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #B5ABA9;
    }

    /* ---- Panel 1: título (dentro de la forma roja) ---- */
    .p-hero {
      --text-left: calc(var(--band-left) + var(--hr) + var(--hero-d) / 2 + 5vw);
      width: 100vw;
      padding-left: var(--text-left);
    }
    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
      max-width: calc(97vw - var(--text-left) - 3vw);
    }
    .hero-num {
      font-family: var(--font-title);
      font-size: 1rem;
      letter-spacing: 0.12em;
      opacity: 0.7;
    }
    .hero-logo { line-height: 0; }
    .hero-title.hero-bask { font-family: 'Libre Baskerville', Georgia, serif; font-style: normal; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1.08; font-size: clamp(2.2rem, 5vw, 4.4rem); }
    .hero-logo.keep img { filter: none; }   /* logos a color (BeBeMi): no se pintan de blanco */
    .hero-logo img { filter: brightness(0) invert(1); display: block; height: clamp(64px, 12vh, 120px); width: auto; max-width: 100%; }
    .hero-title {
      font-family: var(--font-title);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2rem, 4.4vw, 4.4rem);
      line-height: 1.05;
    }
    .tag {
      align-self: flex-start;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--sel);
    }

    /* ---- Panel 2: descripción ---- */

    /* ---- Panel 3: datos ---- */

    /* ---- Panel 4: proceso (etapa + 2 imágenes con texto) ---- */

    /* Texto ampliado: se despliega al pasar el mouse (o tocar) */

    /* ---- Panel 5: UI Kit (recuadro cuadrado) ---- */

    /* ---- Panel 6: grilla de imágenes (2 por columna, círculos) ---- */
    /* Galería asimétrica: columnas con tamaños, sangrías y alturas distintas */

    /* ---- Caso de estudio extenso (proyectos con "sections", p. ej. Mesa) ---- */
    :root { --is: min(44vh, 30vw); }
    /* Placeholder de imagen con la indicación de qué va */

    /* ======================================================================
       MESA · diseño propio del interior (todas las clases empiezan con mz-)
       Tipografías: Kalnia (títulos y textos destacados, en redonda), Inter (cuerpo)
       y Outfit (tarjetas de las user personas, igual que en Figma).
       ====================================================================== */
    .mz { --mh: calc(100vh - var(--header-h) - 56px); --fz: clamp(.56rem, 1.34vh, .76rem); gap: 4vw; padding-right: 4vw; }
    .mz .label { display: block; margin-bottom: .7rem; }

    /* Encabezado de sección: número y título con EL MISMO tamaño en todas las secciones */
    .mz-head { flex: none; }
    .mz-head .n { display: block; font-family: var(--font-title); font-style: normal; font-weight: 400; font-size: clamp(2.6rem, 4.4vw, 3.9rem); line-height: 1; color: rgba(250,250,250,.4); margin-bottom: .7rem; }
    .mz-head h2 { font-family: var(--font-title); font-style: normal; font-weight: 600; font-size: clamp(1.2rem, 1.8vw, 1.65rem); line-height: 1.12; }
    .mz-head.row { display: flex; align-items: baseline; gap: 1.2rem; margin-bottom: 1rem; }
    .mz-head.row .n { margin-bottom: 0; }

    .mz-col { flex: none; width: clamp(300px, 34vw, 520px); display: flex; flex-direction: column; }
    .mz-col .mz-head, .mz-introl .mz-head { margin-bottom: 2.2rem; }
    .mz-lead { font-family: var(--font-title); font-style: normal; font-size: clamp(.92rem, min(1.25vw, 2.4vh), 1.18rem); line-height: 1.38; font-weight: 400; }
    .mz-lead b { font-weight: 600; }
    .mz-lead.gap { margin-top: 1.6rem; }
    .mz-body { font-size: clamp(.78rem, min(1.05vw, 1.9vh), .95rem); line-height: 1.6; opacity: .88; margin-bottom: 1.4rem; }

    /* Primera sección: descripción · pantallas · ficha · programas */
    .mz-info { gap: 3vw; }
    .mz-desc { flex: none; width: clamp(260px, 27vw, 420px); }
    .mz-desc .mz-lead { font-size: clamp(.95rem, min(1.35vw, 2.6vh), 1.25rem); }
    .mz-screens { flex: none; width: clamp(420px, 50vw, 820px); }
    .mz-screens img { width: 100%; height: auto; display: block; }
    .mz-ficha { flex: none; align-self: center; display: flex; flex-direction: column; gap: 2.2vh; padding: 1.2rem 0 1.2rem 2.4vw; border-left: 1px solid rgba(250,250,250,.28); min-width: clamp(150px, 14vw, 220px); }
    .mz-ficha .label { margin-bottom: .35rem; }
    .mz-ficha dd { font-family: var(--font-title); font-size: clamp(.9rem, 1.2vw, 1.1rem); line-height: 1.25; opacity: .82; }
    /* Jerarquía de lectura: nombre del proyecto (grande) › categoría (media) › datos (chicos) */
    .mz-ficha > div:nth-child(1) dd { font-size: clamp(1.6rem, 2.5vw, 2.3rem); line-height: 1.08; font-weight: 600; opacity: 1; }
    .mz-ficha > div:nth-child(2) dd { font-size: clamp(1.1rem, 1.6vw, 1.4rem); opacity: .95; }
    .mz-ficha > div:nth-child(1) { padding-bottom: .9rem; border-bottom: 1px solid rgba(250,250,250,.2); }
    .mz-progs { flex: none; align-self: flex-start; margin-top: calc((var(--mh) - 100px) * .16); }
    .mz-progs-row { display: flex; gap: .9rem; }
    .mz-progs .sq { width: clamp(54px, 5.4vw, 84px); aspect-ratio: 1; border-radius: 18px; background: #E4E0DF var(--img) center / 64% no-repeat; }

    /* 01 Presentación: tal cual el diseño */
    .mz-intro { gap: 4vw; }
    .mz-introl { flex: none; width: clamp(260px, 26vw, 400px); position: relative; }
    .mz-introl::after { content: ""; position: absolute; right: -2vw; top: 62%; width: 1px; height: 2.2rem; background: rgba(250,250,250,.3); }
    .mz-intror { flex: none; height: var(--mh); display: grid; grid-template-columns: clamp(250px, 24vw, 380px) clamp(300px, 33vw, 520px); grid-template-rows: auto auto; column-gap: 3.4vw; row-gap: 1.6rem; align-content: center; }
    .mz-dia { grid-column: 1; grid-row: 1; align-self: start; }
    .dia-svg { width: 100%; height: auto; display: block; overflow: visible; margin-top: 1.2rem; }
    .dia-svg text { font-family: var(--font-body); font-size: 10.5px; fill: #FAFAFA; text-anchor: middle; }
    .dia-t text { font-weight: 700; }
    .dia-b text { font-size: 9.6px; }

      .reveal { transition-duration: 0.01s; transition-delay: 0s; }
      .hero-circle .disc { animation: none; }
      #red-shape.settling { transition-duration: 0.01s; }
    }
  </style>
</head>
<body class="on-red">

  <!-- Forma roja (banda con medio círculo a la derecha) -->
  <div id="red-shape" aria-hidden="true"></div>
  <!-- Segunda forma: el principio del proyecto siguiente, que entra mientras la anterior se retira -->
  <div id="red-shape-b" aria-hidden="true"></div>

  <!-- NAVEGACIÓN: logo · índice de proyectos · menú + cruz -->
  <header>
    <a class="brand" href="index.html"><span class="logo">Melaza Studio</span><span class="tagline">Estudio creativo</span></a>
    <nav class="idx" id="idx" aria-label="Índice de proyectos"></nav>
    <nav>
        <ul>
          <li><a href="sobre-mi.html">Sobre mí</a></li>

            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg>
          </a></li>
        </ul>
      </nav>
  </header>

  <!-- Círculos principales (uno por proyecto): salen hacia la izquierda con el scroll -->
  <div id="hero-layer" aria-hidden="true"></div>

  <!-- Contenido horizontal (se arma desde proyectos.js) -->
  <main id="scroller" tabindex="0">
    <div class="track" id="track"></div>
  </main>

  <div id="progress"><i></i></div>

  <!-- Indicación de scroll: aparece al entrar y se va apenas el usuario empieza a moverse -->
  <div id="scroll-hint" aria-hidden="true"><span id="hint-text">Scrolleá para explorar el proyecto</span><i></i></div>

  <script src="proyectos.js"></script>
  <script src="mesa-contenido.js"></script>
  <script src="argentina-contenido.js"></script>
  <script src="petstar-contenido.js"></script>
  <script src="bebemi-contenido.js"></script>
  <script src="dm-contenido.js"></script>
  <script src="dual-contenido.js"></script>
  <script src="proyectos-final.js"></script>
  <script>
    /* ==========================================================================
       PLANTILLA DE TRABAJO
       Lee ?id=N de la URL, busca el trabajo en PROJECTS y arma los paneles.
       ========================================================================== */
    // Proyecto de arranque: #pN, ?id=N (viene de la Home) o #contacto
    const params = new URLSearchParams(location.search);
    const hashId = parseInt((location.hash.match(/^#p(\d+)$/) || [])[1], 10);
    const startId = hashId || parseInt(params.get('id'), 10) || 1;
    const startIdx = Math.max(0, PROJECTS.findIndex(p => p.id === startId));
    document.title = `${PROJECTS[startIdx].name} — Melaza Studio`;

    const scroller = document.getElementById('scroller');
    const track = document.getElementById('track');
    const progressEl = document.getElementById('progress');
    const progressBar = document.querySelector('#progress i');
    const hintEl = document.getElementById('scroll-hint');
    if (matchMedia('(hover: none)').matches) document.getElementById('hint-text').textContent = 'Deslizá horizontalmente para explorar el proyecto';
    const shape = document.getElementById('red-shape');
    const shapeB = document.getElementById('red-shape-b');

    /* ----- Paneles de un proyecto: la portada (título, número, categoría y botón) y después las secciones
       propias de cada trabajo, que arma p.mesaPanels() en su *-contenido.js ----- */
    function buildPanels(project) {
      const title = project.logo
        ? `<h1 class="hero-title hero-logo${project.logoKeep ? ' keep' : ''} reveal" style="--d:.95s"><img src="${project.logo}" alt="${project.name}"></h1>`
        : project.heroTitle
          ? `<h1 class="hero-title hero-bask reveal" style="--d:.95s" aria-label="${project.name}">${project.heroTitle.join('<br>')}</h1>`
          : `<h1 class="hero-title reveal" style="--d:.95s">${project.name}</h1>`;
      return [`
      <section class="panel p-hero">
        <div class="hero-text">
          <span class="hero-num reveal" style="--d:.8s">${project.number}</span>
          ${title}
          <span class="tag reveal" style="--d:1.1s">${project.category}</span>
          ${project.protoId ? `<a class="ver-proy reveal" style="--d:1.25s" href="#${project.protoId}" data-goto="${project.protoId}">Ver proyecto final <i>→</i></a>` : ''}
        </div>
      </section>`, ...(project.mesaPanels ? project.mesaPanels() : [])];
    }

    /* Contacto: texto + formulario (al final de toda la página) */
    const contactHTML = (isLast) => `
      <section class="panel p-contact"${isLast ? ' id="contacto"' : ''}>
        <div class="ct-head reveal">
          <span class="label">Hablemos</span>
          <h2>Conectemos</h2>
          <p>Contame tus ideas y creemos tu propia obra.</p>
        </div>
        <form class="ct-form reveal" style="--d:.15s" novalidate>${contactFormHTML()}</form>
      </section>`;

    /* Todos los proyectos, uno detrás de otro, en un único recorrido */
    const heroLayer = document.getElementById('hero-layer');
    const idxNav = document.getElementById('idx');
    const html = [];
    PROJECTS.forEach((proj, pi) => {
      const ps = buildPanels(proj);
      ps[0] = ps[0].replace('<section class="panel p-hero"', `<section class="panel p-hero" id="p${proj.id}" data-seg`);
      html.push(...ps);
      html.push(contactHTML(pi === PROJECTS.length - 1));   // contacto al final de cada proyecto
      if (pi < PROJECTS.length - 1) html.push('<section class="panel p-bridge" aria-hidden="true"></section>');

      const hc = document.createElement('div');
      hc.className = 'hero-circle';
      hc.innerHTML = `<div class="disc" data-label="Imagen principal">${proj.images[0] ? `<img src="${proj.images[0]}" alt="">` : ''}</div>`;
      heroLayer.appendChild(hc);

      const a = document.createElement('a');
      a.href = `#p${proj.id}`;
      a.innerHTML = `${proj.number}<span>${proj.name}</span>`;
      a.setAttribute('aria-label', `Proyecto ${proj.number}: ${proj.name}`);
      a.dataset.name = proj.name;
      idxNav.appendChild(a);
    });
    track.innerHTML = html.join('');
    const heroCircles = [...heroLayer.children];
    const heroPanels = [...track.querySelectorAll('.p-hero')];
    const idxLinks = [...idxNav.children];

    // Formulario: envío real por mail (ver CONTACT_EMAIL y enviarContacto en proyectos.js)
    document.querySelectorAll('.ct-form').forEach(f => f.addEventListener('submit', (e) => { e.preventDefault(); enviarContacto(e.target); }));

    // Prototipos de Figma: el iframe captura la rueda, así que se activa con un clic y se libera al salir
    track.querySelectorAll('[data-proto]').forEach(fr => {
      fr.querySelector('.shield').addEventListener('click', () => fr.classList.add('active'));
      fr.addEventListener('mouseleave', () => fr.classList.remove('active'));
    });

    // Mesa · personas: en táctil, tocar el recuadro blanco abre/cierra el perfil completo
    track.querySelectorAll('.mz-persona .pc').forEach(pc => {
      pc.addEventListener('click', () => { if (matchMedia('(hover: none)').matches) pc.classList.toggle('open'); });
    });

    // Mesa · benchmark: con mouse se expande con hover (CSS); en táctil, con un toque
    track.querySelectorAll('.mz-bench .bc').forEach(b => {
      b.addEventListener('click', (e) => {
        if (!matchMedia('(hover: none)').matches) return;
        const on = b.getAttribute('aria-expanded') !== 'true';
        b.setAttribute('aria-expanded', on); liftBench(b, on);
      });
    });

    // Mesa · requisitos: stack de recuadros que cambia con el mouse, el clic o el teclado
    (function () {
      const st = document.getElementById('req-stack');
      if (!st) return;
      const cards = [...st.querySelectorAll('.rq')];
      let cur = -1;
      const set = i => { i = (i + cards.length) % cards.length; if (i === cur) return; cur = i; cards.forEach((c, k) => c.classList.toggle('on', k === i)); };
      set(0);                                                   // queda siempre en el 1…
      cards.forEach(c => c.addEventListener('mouseenter', () => set(+c.dataset.i)));   // …hasta pasar directamente por encima de otro
      st.addEventListener('mouseleave', () => set(0));          // al salir, vuelve al 1
      st.addEventListener('click', e => { const c = e.target.closest('.rq'); if (c) set(+c.dataset.i); });
      cards.forEach(c => c.addEventListener('focus', () => set(+c.dataset.i)));
    })();

    // BeBeMi · poses y concepto: con mouse se revelan con el hover (CSS); en táctil, con un toque
    track.querySelectorAll('.bb-pose, .bb-rv, .dm-tile, .bb-node, .dm-bubbles i').forEach(el => {
      el.addEventListener('click', () => { if (matchMedia('(hover: none)').matches) el.classList.toggle('open'); });
    });

    // BeBeMi · storyboard: una imagen que recorre los 4 cuadros sola; al elegir una escena se queda ahí
    track.querySelectorAll('[data-bbsb]').forEach(box => {
      const imgs = [...box.querySelectorAll('.bb-sb-img img')], btns = [...box.querySelectorAll('.bb-sb-nav button')], txts = [...box.querySelectorAll('.bb-sb-txt > div')], lays = [...box.querySelectorAll('.bb-sb-lay img')];
      let cur = 0, timer = null, seen = false, hover = false;
      const set = i => {
        cur = (i + imgs.length) % imgs.length;
        imgs.forEach((m, k) => m.classList.toggle('on', k === cur));
        lays.forEach((m, k) => m.classList.toggle('on', k === cur));
        txts.forEach((t, k) => t.classList.toggle('on', k === cur));
        btns.forEach((b, k) => { b.classList.toggle('on', k === cur); b.setAttribute('aria-selected', String(k === cur)); });
      };
      const stop = () => { if (timer) { clearInterval(timer); timer = null; } };
      btns.forEach((b, k) => {
        b.addEventListener('click', () => { stop(); set(k); });
        b.addEventListener('mouseenter', () => { if (matchMedia('(hover: hover)').matches) { stop(); set(k); } });   // con mouse, cambia con solo pasar por encima
      });
      box.addEventListener('pointerenter', () => { hover = true; });
      box.addEventListener('pointerleave', () => { hover = false; });
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        timer = setInterval(() => { if (seen && !hover && !document.hidden) set(cur + 1); }, 3800);
        new IntersectionObserver(es => es.forEach(e => { seen = e.isIntersecting; }), { root: scroller, threshold: .4 }).observe(box);
      }
    });

    // DUAL · guión: en la página solo se ve la portada (preview). Con un clic se agranda y recién ahí se pasan las páginas
    // (flechas, teclado o clic en la hoja), con el giro 3D de las hojas.
    track.querySelectorAll('.du-cover').forEach(cv => {
      const pages = cv.dataset.book.split(',').map(f => 'assets/' + f);
      const lb = document.createElement('div'); lb.className = 'bk-lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true'); lb.setAttribute('aria-label', 'Guión literario de DUAL');
      lb.innerHTML = '<button class="bk-x" type="button" aria-label="Cerrar el libro"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg></button><div class="du-bk" data-open="0"><div class="bk3"></div></div><div class="bk-ctrl"><button type="button" class="pv" aria-label="Página anterior">←</button><span class="ct">Portada</span><button type="button" class="nx" aria-label="Página siguiente">→</button></div>';
      document.body.appendChild(lb);
      const bk = lb.querySelector('.du-bk'), stage = lb.querySelector('.bk3'), pv = lb.querySelector('.pv'), nx = lb.querySelector('.nx'), ct = lb.querySelector('.ct');
      const leaves = [];
      for (let k = 0; k * 2 < pages.length; k++) {
        const lf = document.createElement('div'); lf.className = 'leaf';
        lf.innerHTML = `<div class="face front"><img src="${pages[k * 2]}" alt="Página ${k * 2 + 1} del guión" width="1250" height="1760"></div>` + (pages[k * 2 + 1] ? `<div class="face back"><img src="${pages[k * 2 + 1]}" alt="Página ${k * 2 + 2} del guión" width="1250" height="1760"></div>` : '');
        stage.appendChild(lf); leaves.push(lf);
      }
      let n = 0;                                          // hojas dadas vuelta
      const render = () => {
        leaves.forEach((l, i) => { l.classList.toggle('flipped', i < n); l.style.zIndex = i < n ? i + 1 : leaves.length - i; });
        bk.dataset.open = n === 0 ? '0' : (n === leaves.length ? '3' : '1');
        pv.disabled = n === 0; nx.disabled = n === leaves.length;
        ct.textContent = n === 0 ? 'Portada' : (n === leaves.length ? `Página ${pages.length}` : `Páginas ${n * 2}–${n * 2 + 1}`);
      };
      const go = d => { n = Math.min(leaves.length, Math.max(0, n + d)); render(); };
      leaves.forEach((l, i) => l.addEventListener('click', () => go(i < n ? -1 : 1)));
      pv.addEventListener('click', () => go(-1)); nx.addEventListener('click', () => go(1));
      const open = () => { n = 0; render(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; nx.focus(); };
      const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; cv.focus(); };
      cv.addEventListener('click', open);
      lb.querySelector('.bk-x').addEventListener('click', close);
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      window.addEventListener('keydown', e => { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
      render();
    });

    /* ==========================================================================
       VISOR DE IMÁGENES: un clic en cualquier imagen de un proyecto la abre a pantalla completa.
       Si la sección tiene varias imágenes, las flechas (o ← →, o deslizar) pasan de una a otra.
       Excepciones: las fotos de los user personas, los videos y el libro del guion (que tiene su propio visor).
       ========================================================================== */
    /* Precarga y decodificación anticipada: las imágenes se bajan y se decodifican de a una, en los ratos libres, empezando por el proyecto
       actual y siguiendo hacia adelante. Así no se decodifican de golpe (y se traba el scroll) cuando el panel entra en pantalla. */
    (function () {
      const imgs = [...track.querySelectorAll('img')].filter(i => !i.closest('.hero-circle'));
      const first = track.querySelectorAll('.p-hero')[startIdx];
      const from = first ? imgs.findIndex(i => first.compareDocumentPosition(i) & Node.DOCUMENT_POSITION_FOLLOWING) : 0;
      const queue = from > 0 ? [...imgs.slice(from), ...imgs.slice(0, from)] : imgs;
      const idle = window.requestIdleCallback || (f => setTimeout(f, 60));
      let k = 0;
      const next = () => {
        if (k >= queue.length) return;
        const im = queue[k++];
        im.loading = 'eager';
        (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(() => idle(next));
      };
      window.addEventListener('load', () => setTimeout(() => idle(next), 400));
    })();

    const NOVIEW = '.mz-persona, .p-hero, .yt, .du-cover, .lens, .mz-progs, .hero-logo, .zoom-lb, [data-noview]';
    const srcOf = (im) => { const f = im.closest('[data-full]'); return (f && f.dataset.full) || im.currentSrc || im.src; };
    const viewable = (im) => !im.closest(NOVIEW) && !!srcOf(im);
    track.querySelectorAll('img').forEach(im => { if (viewable(im)) im.classList.add('vz'); });
    const groupOf = (im) => {
      const panel = im.closest('.panel') || track, seen = new Set(), list = [];
      panel.querySelectorAll('img').forEach(x => {
        if (!viewable(x)) return;
        const u = srcOf(x); if (seen.has(u)) { if (x === im) list.splice(list.findIndex(l => l.u === u), 1, { u, alt: x.alt }); return; }
        seen.add(u); list.push({ u, alt: x.alt });
      });
      return list;
    };
    let vz = null;
    function openViewer(im) {
      if (!vz) {
        vz = document.createElement('div'); vz.id = 'img-lb'; vz.className = 'zoom-lb vz-lb'; vz.setAttribute('role', 'dialog'); vz.setAttribute('aria-modal', 'true'); vz.setAttribute('aria-label', 'Imagen a pantalla completa');
        vz.innerHTML = '<button class="x" type="button" aria-label="Cerrar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l12 12M14 2L2 14"/></svg></button>'
          + '<button class="nv prev" type="button" aria-label="Imagen anterior"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L4 8l6 6"/></svg></button>'
          + '<button class="nv next" type="button" aria-label="Imagen siguiente"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2l6 6-6 6"/></svg></button>'
          + '<img alt=""><span class="cnt" aria-live="polite"></span>';
        document.body.appendChild(vz);
        vz.state = { list: [], i: 0 };
        const big = vz.querySelector('img'), cnt = vz.querySelector('.cnt');
        const show = () => { const { list, i } = vz.state; big.src = list[i].u; big.alt = list[i].alt; cnt.textContent = list.length > 1 ? `${i + 1} / ${list.length}` : ''; vz.classList.toggle('single', list.length < 2); vz.scrollTop = 0; };
        const go = (d) => { const n = vz.state.list.length; if (n < 2) return; vz.state.i = (vz.state.i + d + n) % n; show(); };
        const close = () => { vz.classList.remove('open'); document.body.style.overflow = ''; };
        vz.show = show; vz.go = go; vz.close = close;
        vz.addEventListener('click', e => { if (e.target.closest('.nv')) { go(e.target.closest('.nv').classList.contains('next') ? 1 : -1); return; } if (e.target.closest('.x') || e.target !== big) close(); });
        window.addEventListener('keydown', e => {
          if (!vz.classList.contains('open')) return;
          if (e.key === 'Escape') { close(); e.stopImmediatePropagation(); }
          else if (e.key === 'ArrowRight') { go(1); e.preventDefault(); e.stopImmediatePropagation(); }
          else if (e.key === 'ArrowLeft') { go(-1); e.preventDefault(); e.stopImmediatePropagation(); }
        }, true);
        let sx = null;      // deslizar con el dedo
        vz.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') sx = e.clientX; });
        vz.addEventListener('pointerup', e => { if (sx !== null && Math.abs(e.clientX - sx) > 50) go(e.clientX < sx ? 1 : -1); sx = null; });
      }
      const list = groupOf(im), u = srcOf(im);
      vz.state.list = list.length ? list : [{ u, alt: im.alt }];
      vz.state.i = Math.max(0, vz.state.list.findIndex(l => l.u === u));
      vz.show(); vz.classList.add('open'); document.body.style.overflow = 'hidden';
    }
    track.addEventListener('click', (e) => {
      const t = e.target.closest ? e.target : null, sq = t && t.closest('.du-sq .sq');
      const im = t && (t.closest('img') || (sq && sq.querySelector('img')));      // en Blanc y Noir el texto tapa la foto: el clic en la card abre la foto
      if (im && viewable(im)) openViewer(im);
    });
    // Teclado: Enter o espacio sobre una imagen con foco (galería, lupa)
    track.querySelectorAll('.zoomable, .lb-img').forEach(f => f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const im = f.querySelector('img'); if (im) openViewer(im); } }));

    // Lupa circular (UI Kit de PetStar): sigue al mouse sobre la imagen; el clic abre el visor
    track.querySelectorAll('.zoomable').forEach(z => {
      const im = z.querySelector('img'), lens = z.querySelector('.lens'), ZM = 2.44, R = 95;
      lens.style.backgroundImage = `url("${z.dataset.full}")`;
      z.addEventListener('pointermove', (e) => {
        if (e.pointerType !== 'mouse') return;
        const r = im.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
        z.classList.add('on');
        lens.style.left = (x - R) + 'px'; lens.style.top = (y - R) + 'px';
        lens.style.backgroundSize = `${r.width * ZM}px ${r.height * ZM}px`;
        lens.style.backgroundPosition = `${R - x * ZM}px ${R - y * ZM}px`;
      });
      z.addEventListener('pointerleave', () => z.classList.remove('on'));
    });

    /* ==========================================================================
       FORMA ROJA: p = 0 → banda con medio círculo sobre fondo blanco
                   p = 1 → todo rojo
       ========================================================================== */
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* orient 'left'  → inicio: parte redondeada a la izquierda (banda pegada al borde derecho)
       orient 'right' → final: parte redondeada a la derecha (banda pegada al borde izquierdo) */
    function applyShape(p, orient) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const e = 1 - Math.pow(1 - p, 3);                  // arranca rápido, llega suave
      const portrait = vw < vh;
      const wL = vw * (portrait ? 0.94 : 0.9);
      const h0 = vh * 0.76;
      const r0 = Math.min(h0 / 2, wL * 0.45);
      const w0 = orient === 'right' ? vw / 2 + r0 : wL;   // al final la curva queda concéntrica con el círculo centrado
      const w = lerp(w0, vw, e);
      const r = lerp(r0, 0, e);
      shape.style.top = `${lerp(vh * 0.12, 0, e)}px`;
      shape.style.height = `${lerp(h0, vh, e)}px`;
      shape.style.width = `${w}px`;
      if (orient === 'right') {
        shape.style.left = '0px';
        shape.style.borderRadius = `0 ${r}px ${r}px 0`;
      } else {
        shape.style.left = `${vw - w}px`;
        shape.style.borderRadius = `${r}px 0 0 ${r}px`;
      }
      document.body.classList.toggle('on-red', e > 0.55 || !document.documentElement.classList.contains('ready'));
    }

    /* ==========================================================================
       SCROLL: la rueda vertical se convierte en desplazamiento horizontal suave
       ========================================================================== */
    const maxScroll = () => scroller.scrollWidth - scroller.clientWidth;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let target = 0;      // posición a la que queremos llegar
    let current = 0;     // posición suavizada actual
    let animating = false;

    function loop() {
      current += (target - current) * (reduced ? 1 : 0.12);
      if (Math.abs(target - current) < 0.5) current = target;
      scroller.scrollLeft = current;
      if (current !== target) requestAnimationFrame(loop);
      else animating = false;
    }
    function scrollToX(x) {
      target = clamp(x, 0, maxScroll());
      if (!animating) { animating = true; requestAnimationFrame(loop); }
    }

    scroller.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;   // gesto horizontal: nativo
      const sc = e.target.closest && e.target.closest('.mz-scroll');   // lista o página con scroll propio: se desplaza por adentro hasta llegar al final
      if (sc && sc.scrollHeight > sc.clientHeight + 2 && ((e.deltaY > 0 && sc.scrollTop + sc.clientHeight < sc.scrollHeight - 1) || (e.deltaY < 0 && sc.scrollTop > 0))) return;
      e.preventDefault();
      const dy = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY;
      scrollToX(target + dy * 1.4);
    }, { passive: false });

    // Teclado
    window.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, textarea, select, button, a')) return;
      const step = window.innerWidth * 0.7;
      const keys = {
        ArrowRight: step, ArrowDown: step, PageDown: step, ' ': step,
        ArrowLeft: -step, ArrowUp: -step, PageUp: -step
      };
      if (e.key in keys) { e.preventDefault(); scrollToX(target + keys[e.key]); }
      if (e.key === 'Home') { e.preventDefault(); scrollToX(0); }
      if (e.key === 'End')  { e.preventDefault(); scrollToX(maxScroll()); }
    });

    /* Sincroniza con scroll nativo (táctil / trackpad), extiende la forma roja y
       mueve el círculo principal: sale hacia la izquierda un poco más rápido que
       el contenido y desaparece. */
    /* Posición de cada proyecto (ancla) y del contacto, en px dentro del recorrido */
    let segX = [], contactX = 0, activeSeg = -1, userMoved = false;
    function measure() {
      const base = scroller.getBoundingClientRect().left - scroller.scrollLeft;
      const pos = el => el.getBoundingClientRect().left - base;
      segX = [...track.querySelectorAll('[data-seg]')].map(pos);
      contactX = pos(document.getElementById('contacto'));
    }
    const segAt = (x) => { let i = 0; segX.forEach((v, k) => { if (x >= v - 1) i = k; }); return i; };
    function jumpTo(x) { current = target = x; scroller.scrollLeft = x; }

    const BRIDGE = 1.12;  // largo de la animación de salida/entrada entre proyectos, en pantallas. Empieza dentro del panel de contacto (0.95 pantallas antes del siguiente proyecto) y el tramo vacío .p-bridge mide solo 17vw. Con menos de ~1.09 la forma que sale y la que entra se pisarían.
    function geom() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const wL = vw * (vw < vh ? 0.94 : 0.9), h0 = vh * 0.76;
      const r0 = Math.min(h0 / 2, wL * 0.45);
      return { wL, h0, r0, w0: vw / 2 + r0, top: vh * 0.12 };
    }

    /* Centrado: el bloque de contenido de cada panel (de su elemento más alto al más bajo) queda centrado en la pantalla.
       Se mide con offsetTop (sin transformaciones), así no lo afectan las animaciones de aparición. */
    const CENTER_SEL = '.af-pres, .af-id, .af-mock, .af-case, .af-specp, .mz-info, .mz-protosec, .dm-art, .p-contact, .mz-personas, .mz-benchs';
    /* Benchmark de Mesa: al abrir una card, la columna sube lo justo para que el texto desplegado no se salga de la pantalla */
    function liftBench(bc, on) {
      const bench = bc.closest('.mz-bench');
      if (!on) { bench.classList.remove('lift'); return; }
      const more = bc.querySelector('.bc-more'), inn = bc.querySelector('.bc-more-in');
      const baseTop = bench.getBoundingClientRect().top + (bench._lift || 0);
      const bottom = baseTop + bench.offsetHeight - more.offsetHeight + inn.scrollHeight;
      const hdr = (document.querySelector('header') || { offsetHeight: 70 }).offsetHeight;
      const lift = Math.max(0, Math.min(bottom - (window.innerHeight - 20), baseTop - (hdr + 6)));
      bench._lift = lift; bench.style.setProperty('--lift', lift + 'px'); bench.classList.add('lift');
    }
    track.querySelectorAll('.mz-bench .bc').forEach(bc => {
      bc.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') liftBench(bc, true); });
      bc.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') liftBench(bc, false); });
      bc.addEventListener('focus', () => liftBench(bc, true)); bc.addEventListener('blur', () => liftBench(bc, false));
    });
    track.querySelectorAll('.mz-benchs').forEach(p => p.querySelectorAll('.bc').forEach(bc => ['pointerenter', 'focus'].forEach(ev => bc.addEventListener(ev, () => { p._frozen = true; }))));
    function centerBlocks() {
      document.querySelectorAll('#track .panel').forEach(p => {
        if (!p.matches(CENTER_SEL)) return;
        if (p._frozen) return;   // benchmark: tras el primer hover la posición queda fija (así solo se mueve la card que abrís)
        p.style.top = '0px';
        const kids = [...p.children].filter(c => c.offsetWidth && getComputedStyle(c).position !== 'absolute');
        if (!kids.length) return;
        let top = Math.min(...kids.map(c => c.offsetTop)), bot = Math.max(...kids.map(c => c.offsetTop + c.offsetHeight));
        const pr = p.getBoundingClientRect();
        let minTop = -Infinity;
        if (p.matches('.mz-benchs')) {      // se centra con la altura de la card más larga YA abierta, así ninguna se sale de la pantalla
          const hdr = (document.querySelector('header') || { offsetHeight: 70 }).offsetHeight, avail = window.innerHeight - 26 - (hdr + 6);
          const ext = kids.map(b => { const m = b.querySelector('.bc-more'), i = b.querySelector('.bc-more-in'); return { open: b.offsetTop + b.offsetHeight - m.offsetHeight + i.scrollHeight, more: i.scrollHeight, i }; });
          bot = Math.max(...ext.map(e => e.open));
          const worst = ext.reduce((a, e) => (e.open > a.open ? e : a), ext[0]);
          const more0 = worst.more / (p._bk || 1), k = Math.max(.7, Math.min(1, (avail - (worst.open - top - worst.more)) / more0));   // sobre el alto SIN escalar, para que no oscile
          if (Math.abs(k - (p._bk || 1)) > .01) { p._bk = k; p.style.setProperty('--bk', k); }
          minTop = hdr + 6;
        }
        let dy = window.innerHeight / 2 - (pr.top + (top + bot) / 2);
        if (pr.top + top + dy < minTop) dy = minTop - (pr.top + top);
        p.style.top = `${Math.round(dy)}px`;
      });
    }
    /* Re-sincroniza las posiciones de cada proyecto: si el ancho de un panel cambia después de cargar (tipografías web,
       imágenes), el scroll se mantiene anclado al proyecto en el que estás y el círculo principal queda siempre pegado a su título */
    let navSeg = null;   // proyecto al que viaja el índice: si durante el viaje cambian los anchos, se corrige el destino
    function resync() {
      if (animating) { measure(); if (navSeg !== null) target = clamp(segX[navSeg], 0, maxScroll()); return; }
      const x = scroller.scrollLeft, i = Math.max(0, segAt(x)), off = x - (segX[i] || 0), wasContact = activeSeg === -2;
      const before = segX.join(',') + '|' + contactX;
      measure();
      if (segX.join(',') + '|' + contactX === before) return;
      if (!userMoved) jumpTo(location.hash === '#contacto' ? contactX : segX[Math.max(0, activeSeg < 0 ? startIdx : activeSeg)]);
      else jumpTo(wasContact ? contactX + off : segX[i] + off);
      onScroll();
    }
    /* Si algo cambia de tamaño después (tipografías web, imágenes que terminan de cargar), el centrado se recalcula solo */
    (function () {
      let raf = 0;
      const again = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { if (typeof resync === 'function') resync(); centerBlocks(); }); };
      if (window.ResizeObserver) { const ro = new ResizeObserver(again); ro.observe(track); document.querySelectorAll('#track .panel').forEach(p => { ro.observe(p); [...p.children].forEach(c => ro.observe(c)); }); }
      if (document.fonts) { document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', again); document.fonts.ready.then(again); }
      window.addEventListener('load', again);
      [300, 1000, 2500].forEach(ms => setTimeout(again, ms));
    })();
    let ticking = false;
    function updateFromScroll() {
      const x = scroller.scrollLeft, vw = window.innerWidth, half = vw * 0.5;
      const i = segAt(x), last = i === segX.length - 1;
      const nextX = last ? contactX : segX[i + 1];

      // Círculo principal de cada proyecto: sale hacia la izquierda un poco más rápido que el contenido
      // La posición sale del panel REAL del título (no de medidas guardadas): así el círculo y su título nunca se desfasan,
      // aunque el ancho de otros paneles cambie después de cargar. Primero se leen todas las posiciones y después se escribe (sin forzar layout en cada círculo).
      const lefts = heroCircles.map((hc, k) => { const hp = heroPanels[k]; return hp ? hp.getBoundingClientRect().left : -(x - segX[k]); });
      heroCircles.forEach((hc, k) => {
        const t = lefts[k] * 1.15, vis = (t < vw + 40 && t > -vw - 120);
        if (vis || hc._vis) hc.style.transform = `translate3d(${t}px, 0, 0)`;
        if (vis !== hc._vis) { hc._vis = vis; hc.style.visibility = vis ? 'visible' : 'hidden'; }
      });

      /* Forma roja.
         · Entrada de un proyecto: banda con medio círculo a la izquierda que se expande hasta cubrir todo.
         · Salida (tramo vacío entre proyectos, 1.3 pantallas): el rojo se retira y deja el FINAL de un
           proyecto (banda con medio círculo a la derecha); entonces entra desde la derecha el PRINCIPIO del
           siguiente (medio círculo a la izquierda). Por un momento se ven los dos semicírculos enfrentados. */
      const g = geom();
      const bridgeW = BRIDGE * vw;
      const bridgeStart = last ? Infinity : nextX - bridgeW;
      let p;
      if (x >= bridgeStart) {
        const u = x - bridgeStart;
        p = clamp(1 - u / half, 0, 1);                       // el rojo se retira hasta formar el final
        applyShape(p, 'right');
        const bFinal = vw - g.wL;                           // posición del principio del proyecto siguiente
        const bLeft = bFinal + 1.15 * (bridgeW - u);        // llega a la misma velocidad que su círculo
        const gap = vw * 0.06;
        const u0 = bridgeW - (g.w0 + gap - bFinal) / 1.15;  // desde acá viajan juntos hacia la izquierda
        const tt = clamp((u - u0) / (bridgeW - u0), 0, 1);
        const shift = 1.15 * Math.max(0, u - u0) + vw * 0.1 * tt * tt;
        if (u > u0) shape.style.left = `${-shift}px`;
        shapeB.style.display = bLeft < vw ? 'block' : 'none';
        shapeB.style.top = `${g.top}px`;
        shapeB.style.height = `${g.h0}px`;
        shapeB.style.width = `${g.wL}px`;
        shapeB.style.left = `${bLeft}px`;
        shapeB.style.borderRadius = `${g.r0}px 0 0 ${g.r0}px`;
      } else {
        shapeB.style.display = 'none';
        p = clamp((x - segX[i]) / half, 0, 1);              // entrada del proyecto
        applyShape(p, 'left');
      }
      document.body.classList.toggle('show-progress', p > 0.35);

      // Progreso dentro del proyecto actual
      const span = Math.max(1, nextX - segX[i]);
      const frac = clamp((x - segX[i]) / span, 0, 1);
      progressBar.style.transform = `scaleX(${frac})`;
      progressEl.style.setProperty('--pos', `${frac * 100}%`);

      // Índice: proyecto actual (y título / ancla de la barra de direcciones)
      const inContact = x >= contactX - half;
      const seg = inContact ? -2 : i;
      if (seg !== activeSeg) {
        activeSeg = seg;
        idxLinks.forEach((a, k) => a.classList.toggle('on', k === seg));
        if (seg >= 0) idxNav.scrollTo({ left: idxLinks[seg].offsetLeft - idxNav.clientWidth / 2 + idxLinks[seg].offsetWidth / 2, behavior: 'smooth' });
        const pr = PROJECTS[i];
        document.title = inContact ? 'Contacto — Melaza Studio' : `${pr.name} — Melaza Studio`;
        history.replaceState(null, '', location.pathname + (inContact ? '#contacto' : `#p${pr.id}`));
      }
      if (x > 40) hintEl.classList.add('gone');
    }
    function onScroll() {
      if (!animating) { current = target = scroller.scrollLeft; }
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { updateFromScroll(); ticking = false; });
    }
    scroller.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => { track.querySelectorAll('.mz-benchs').forEach(p => { p._frozen = false; }); centerBlocks(); const k = Math.max(0, activeSeg); measure(); jumpTo(activeSeg === -2 ? contactX : segX[k]); onScroll(); });
    ['wheel', 'touchstart', 'keydown', 'pointerdown'].forEach(ev => scroller.addEventListener(ev, () => { userMoved = true; navSeg = null; }, { passive: true }));

    // Anclas: el índice y "Contacto" llevan suavemente al proyecto / formulario
    idxLinks.forEach((a, k) => a.addEventListener('click', (e) => {
      e.preventDefault(); navSeg = k; scrollToX(segX[k]);
      const t = setInterval(() => {          // al llegar, se verifica que el destino siga siendo exacto
        if (navSeg !== k) { clearInterval(t); return; }
        if (animating) return;
        clearInterval(t); measure();
        if (Math.abs(scroller.scrollLeft - segX[k]) > 1) { jumpTo(segX[k]); onScroll(); }
        navSeg = null;
      }, 250);
    }));
    // Botón "Ver proyecto": lleva directo al prototipo
    document.querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', (e) => {
      e.preventDefault();
      const el = document.getElementById(a.dataset.goto);
      if (el) scrollToX(el.getBoundingClientRect().left - (scroller.getBoundingClientRect().left - scroller.scrollLeft));
    }));
    /* Barra de progreso: clic o arrastre para moverse dentro del proyecto actual
       (el recorrido de la barra va desde el inicio del proyecto hasta el inicio del siguiente) */
    (function () {
      let dragging = false, seg = 0;
      const xAt = (e) => {
        const r = progressEl.getBoundingClientRect();
        const f = clamp((e.clientX - r.left) / r.width, 0, 1);
        const next = seg === segX.length - 1 ? contactX : segX[seg + 1];
        return segX[seg] + f * (next - segX[seg]);
      };
      progressEl.addEventListener('pointerdown', (e) => {
        dragging = true; userMoved = true;
        seg = segAt(scroller.scrollLeft);           // proyecto en el que estás al empezar
        progressEl.setPointerCapture(e.pointerId);
        progressEl.classList.add('drag');
        scrollToX(xAt(e));                           // clic: viaja suave hasta ahí
      });
      progressEl.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const x = clamp(xAt(e), 0, maxScroll());
        target = x; if (!animating) jumpTo(x);       // arrastre: sigue al puntero
      });
      const end = () => { dragging = false; progressEl.classList.remove('drag'); };
      progressEl.addEventListener('pointerup', end);
      progressEl.addEventListener('pointercancel', end);
    })();

    /* Entrada: llega todo rojo (como termina la expansión del home) y la forma se
       encoge hasta quedar como banda roja con medio círculo sobre fondo blanco. */
    centerBlocks();
    measure();
    jumpTo(location.hash === '#contacto' ? contactX : segX[startIdx]);
    // Si cargan las tipografías cambian los anchos: se vuelve a medir mientras el usuario no se movió
    const remeasure = () => { centerBlocks(); resync(); };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);
    window.addEventListener('load', remeasure);
    applyShape(1, 'left');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.documentElement.classList.add('ready');
      shape.classList.add('settling');
      updateFromScroll();
      setTimeout(() => shape.classList.remove('settling'), 1300);
    }));
    scroller.focus({ preventScroll: true });

    /* ==========================================================================
       APARICIÓN AL ENTRAR EN PANTALLA
       ========================================================================== */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.classList.add('in');
        io.unobserve(en.target);
      });
    }, { root: scroller, threshold: 0.25 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    /* ==========================================================================
       CRUZ: vuelve a la Home con un fundido
       ========================================================================== */
    document.getElementById('close').addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.add('is-leaving');
      setTimeout(() => { location.href = 'index.html'; }, 350);
    });

    // Al volver con "atrás" no debe quedar la página transparente
    window.addEventListener('pageshow', () => document.body.classList.remove('is-leaving'));
  </script>
</body>
</html>
